<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'none'; font-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1d5da6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shop Tracker">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Weld Shop Tracker</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="hdr" id="hdr">
  <div class="brand">
    <span class="eyebrow" id="hdr-date">Weld Shop Tracker</span>
    <select class="cls-select" id="cls-select" aria-label="Class"></select>
  </div>
  <button class="icon-btn" id="setup-btn" type="button" aria-label="Setup" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>
  </button>
</header>
<main id="main" aria-live="off"></main>
<nav class="nav" id="nav" aria-label="Sections">
  <button type="button" data-tab="class">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>
    Class
  </button>
  <button type="button" data-tab="check">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/></svg>
    Checkpoints
  </button>
  <button type="button" data-tab="booths">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="2"/><path d="M8 12.5l2.6 2.6L16 9.5"/></svg>
    Booths
  </button>
  <button type="button" data-tab="reports">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 20h16"/><path d="M7 16v-5M12 16V6M17 16v-8"/></svg>
    Reports
  </button>
</nav>
<div id="sheet-root"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="restore-file" accept="application/json,.json" hidden>
<script src="app.js" charset="utf-8"></script>
</body>
</html>
